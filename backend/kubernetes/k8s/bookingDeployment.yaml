apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
      - name: booking-service
        image: us-central1-docker.pkg.dev/evento-booking-446810/eventobooking/booking-service:latest
        ports:
        - containerPort: 4003
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
spec:
  selector:
    app: booking-service
  ports:
  - port: 4003
    targetPort: 4003
  type: ClusterIP